bundle:
  name: ducat_lakehouse
  uuid: 8a5958ed-21ad-4190-bdde-4b13758512c7

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: python -m pip wheel --no-deps --wheel-dir dist .

variables:
  catalog:
    description: Unity Catalog catalog that holds the pipeline schema
  schema:
    description: Schema the bundle creates for the pipeline tables and the raw volume

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: workspace
      schema: ducat
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: ducat_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
