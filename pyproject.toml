[project]
name = "ducat_lakehouse"
version = "0.1.0"
description = "Pipeline layer of the Ducat personal-finance insights engine on Databricks"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
synth = "ducat_lakehouse.synth:main"
bronze = "ducat_lakehouse.bronze:main"
silver = "ducat_lakehouse.silver:main"
gold = "ducat_lakehouse.gold:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducat_lakehouse"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "ducat_lakehouse/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
